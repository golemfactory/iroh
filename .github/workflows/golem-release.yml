# golemfactory fork: builds iroh-relay from this branch and publishes it as a
# GitHub pre-release. Trigger: push a tag `golem-v<iroh version>-<n>`, e.g.
# golem-v1.5.0-1 (deliberately not `v*`, which is upstream's release tag
# pattern). workflow_dispatch builds the binaries as artifacts only.
name: golem release

on:
  push:
    tags: ["golem-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golem-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: iroh-relay ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04: glibc 2.35, so the gnu binaries run on older hosts too.
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-22.04-arm }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install musl tools
        if: contains(matrix.target, '-musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ $TARGET == *-musl ]]; then
            # Static musl binary, as upstream's release.yml builds it.
            export "CARGO_TARGET_$(echo "$TARGET" | tr 'a-z-' 'A-Z_')_LINKER=musl-gcc"
            export CC=musl-gcc
            export RUSTFLAGS="-C target-feature=+crt-static -C relocation-model=static -C link-arg=-static"
          fi
          cargo build --locked --profile optimized-release -p iroh-relay --features server --bin iroh-relay --target "$TARGET"

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          bin="target/$TARGET/optimized-release/iroh-relay"
          "$bin" --version
          staging="iroh-relay-$NAME-$TARGET"
          mkdir "$staging"
          cp "$bin" "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          sha256sum "$staging.tar.gz" > "$staging.tar.gz.sha256"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iroh-relay-${{ matrix.target }}
          path: iroh-relay-*.tar.gz*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish pre-release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the release and uploads its assets
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          cat > notes.md <<NOTES
          iroh-relay built from \`$SHA\` (branch \`golem-release\`): upstream iroh
          main plus bounded relay actor waits and recovery of stalled relay tasks
          (n0-computer/iroh#4686). Not an upstream release.

          Linux x86_64 and aarch64; \`-gnu\` needs glibc 2.35 or later, \`-musl\` is static.
          Verify with \`sha256sum -c SHA256SUMS\`.
          NOTES
          gh release create "$TAG" --repo "$REPO" --verify-tag --prerelease \
            --title "iroh-relay $TAG" --notes-file notes.md \
            ./*.tar.gz SHA256SUMS
