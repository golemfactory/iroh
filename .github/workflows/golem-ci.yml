# golemfactory fork: checks for the golem-release branch. Upstream's own
# workflows are removed on this branch: they need n0's runners and secrets.
name: golem CI

on:
  push:
    branches: [golem-release]
  pull_request:
    branches: [golem-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golem-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings
  CARGO_TERM_COLOR: never

jobs:
  check:
    name: fmt, clippy, tests (iroh, iroh-relay)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: |
          cargo clippy --locked -p iroh --lib --tests
          cargo clippy --locked -p iroh-relay --features server --lib --bins --tests

      - name: Tests
        run: |
          cargo test --locked -p iroh --lib
          cargo test --locked -p iroh-relay --features server --lib
